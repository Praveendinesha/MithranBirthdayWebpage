<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7E6"/>
      <stop offset="50%" stop-color="#FCFBF7"/>
      <stop offset="100%" stop-color="#FEE7B8"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" rx="36" fill="url(#bg2)"/>
  <circle cx="300" cy="260" r="180" fill="url(#glow2)"/>
  <rect x="24" y="24" width="552" height="552" rx="24" fill="none" stroke="#FBC052" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>

  <g fill="#E5A62E" opacity="0.7">
    <path d="M110 130 L115 145 L130 150 L115 155 L110 170 L105 155 L90 150 L105 145 Z"/>
    <path d="M490 130 L495 145 L510 150 L495 155 L490 170 L485 155 L470 150 L485 145 Z"/>
  </g>

  <!-- Illustration Center: Big Smiles & Fan -->
  <g transform="translate(300, 260)">
    <circle cx="0" cy="0" r="110" fill="#FFFFFF" filter="drop-shadow(0 10px 20px rgba(229, 166, 46, 0.15))"/>
    <text x="0" y="25" font-size="90" text-anchor="middle">😊</text>
    <text x="0" y="-80" font-size="38" text-anchor="middle">✨</text>
  </g>

  <!-- Badge Pill -->
  <g transform="translate(300, 430)">
    <rect x="-110" y="-22" width="220" height="44" rx="22" fill="#C08316"/>
    <text x="0" y="6" font-family="'Cinzel', Georgia, serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">MONTH 02</text>
  </g>

  <!-- Title -->
  <text x="300" y="500" font-family="'Cinzel', Georgia, serif" font-size="24" font-weight="bold" fill="#1D2E49" text-anchor="middle">First Million-Dollar Smile</text>
  <text x="300" y="530" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" fill="#E5A62E" text-anchor="middle">Heart Melting Grins & Giggles</text>
</svg>
