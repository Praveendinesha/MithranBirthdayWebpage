<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="50%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <radialGradient id="glow7" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" rx="36" fill="url(#bg7)"/>
  <circle cx="300" cy="260" r="180" fill="url(#glow7)"/>
  <rect x="24" y="24" width="552" height="552" rx="24" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Illustration Center: Sitting Prince -->
  <g transform="translate(300, 260)">
    <circle cx="0" cy="0" r="110" fill="#FFFFFF" filter="drop-shadow(0 10px 20px rgba(245, 158, 11, 0.15))"/>
    <text x="0" y="25" font-size="90" text-anchor="middle">👑</text>
    <text x="0" y="-80" font-size="38" text-anchor="middle">🪑</text>
  </g>

  <!-- Badge Pill -->
  <g transform="translate(300, 430)">
    <rect x="-110" y="-22" width="220" height="44" rx="22" fill="#D97706"/>
    <text x="0" y="6" font-family="'Cinzel', Georgia, serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">MONTH 07</text>
  </g>

  <!-- Title -->
  <text x="300" y="500" font-family="'Cinzel', Georgia, serif" font-size="24" font-weight="bold" fill="#1D2E49" text-anchor="middle">Sitting Like a Prince</text>
  <text x="300" y="530" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" fill="#D97706" text-anchor="middle">Royal Throne Pose & Happy Bounces</text>
</svg>
